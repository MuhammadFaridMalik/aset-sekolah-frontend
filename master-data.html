<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Master - Manajemen Aset Sekolah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="topbar">
            <h1>Data Master</h1>
            <div class="user-info">
                <a href="dashboard.html">← Kembali ke Dashboard</a>
                <button onclick="logout()">Keluar</button>
            </div>
        </header>

        <main class="content">
            <div class="tabs">
                <button class="tab-btn active" data-tab="kategori">Kategori</button>
                <button class="tab-btn" data-tab="lokasi">Lokasi</button>
            </div>

            <section id="tabKategori" class="tab-panel">
                <div class="toolbar">
                    <button onclick="openMasterModal('category')">+ Tambah Kategori</button>
                </div>
                <table class="data-table">
                    <thead><tr><th>Nama Kategori</th><th>Total Aset</th><th>Aksi</th></tr></thead>
                    <tbody id="categoryTableBody"></tbody>
                </table>
            </section>

            <section id="tabLokasi" class="tab-panel" style="display:none;">
                <div class="toolbar">
                    <button onclick="openMasterModal('location')">+ Tambah Lokasi</button>
                </div>
                <table class="data-table">
                    <thead><tr><th>Nama Ruangan</th><th>Gedung</th><th>Total Aset</th><th>Aksi</th></tr></thead>
                    <tbody id="locationTableBody"></tbody>
                </table>
            </section>
        </main>
    </div>

    <div id="masterModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h2 id="masterModalTitle">Tambah Kategori</h2>
            <form id="masterForm">
                <input type="hidden" id="masterId">
                <input type="hidden" id="masterType">

                <div class="form-group">
                    <label id="masterNameLabel" for="masterName">Nama Kategori</label>
                    <input type="text" id="masterName" required>
                </div>
                <div class="form-group" id="masterBuildingGroup" style="display:none;">
                    <label for="masterBuilding">Gedung</label>
                    <input type="text" id="masterBuilding">
                </div>

                <p id="masterFormError" class="error-message"></p>

                <div class="modal-actions">
                    <button type="button" onclick="closeMasterModal()">Batal</button>
                    <button type="submit">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/master-data.js"></script>
</body>
</html>
