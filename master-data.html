<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Master - Manajemen Aset Sekolah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">Manajemen Aset</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link active">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
                    Dashboard
                </a>
                <a id="masterDataLink" href="master-data.html" class="sidebar-link" style="display:none;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="m12 2 9 4.9-9 4.9-9-4.9Z"/><path d="m3 12 9 4.9 9-4.9"/><path d="m3 17 9 4.9 9-4.9"/></svg>
                    Kelola Data Master
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-footer-user">
                    <div class="avatar" id="userAvatar"></div>
                    <div>
                        <div class="user-name" id="userName"></div>
                        <div class="user-role" id="userRole"></div>
                    </div>
                </div>
                <button class="btn-ghost" onclick="logout()">
                    <svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Keluar
                </button>
            </div>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <h1>Data Master</h1>
            </header>

            <main class="content">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="kategori">Kategori</button>
                    <button class="tab-btn" data-tab="lokasi">Lokasi</button>
                </div>

                <section id="tabKategori" class="tab-panel">
                    <div class="toolbar">
                        <button onclick="openMasterModal('category')">+ Tambah Kategori</button>
                    </div>
                    <table class="data-table">
                        <thead><tr><th>Nama Kategori</th><th>Total Aset</th><th>Aksi</th></tr></thead>
                        <tbody id="categoryTableBody"></tbody>
                    </table>
                </section>

                <section id="tabLokasi" class="tab-panel" style="display:none;">
                    <div class="toolbar">
                        <button onclick="openMasterModal('location')">+ Tambah Lokasi</button>
                    </div>
                    <table class="data-table">
                        <thead><tr><th>Nama Ruangan</th><th>Gedung</th><th>Total Aset</th><th>Aksi</th></tr></thead>
                        <tbody id="locationTableBody"></tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>

    <div id="masterModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h2 id="masterModalTitle">Tambah Kategori</h2>
            <form id="masterForm">
                <input type="hidden" id="masterId">
                <input type="hidden" id="masterType">

                <div class="form-group">
                    <label id="masterNameLabel" for="masterName">Nama Kategori</label>
                    <input type="text" id="masterName" required>
                </div>
                <div class="form-group" id="masterBuildingGroup" style="display:none;">
                    <label for="masterBuilding">Gedung</label>
                    <input type="text" id="masterBuilding">
                </div>

                <p id="masterFormError" class="error-message"></p>

                <div class="modal-actions">
                    <button type="button" onclick="closeMasterModal()">Batal</button>
                    <button type="submit">Simpan</button>
                </div>
            </form>
        </div>
    </div>
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/config.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/master-data.js"></script>
</body>
</html>
